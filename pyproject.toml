[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "liminal-libs"
version = "1.47.0"  # the library's own release (CHANGELOG.md)
description = "The Liminal library: the stores, the plugin contract, the collector and the scheme every Liminal program builds on (the chart app, the integrator, the plugins)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    # pandas 3.1 refuses exchange_calendars' OrthodoxEaster offset ("does not have a vectorized
    # implementation"), and Belgrade, Bucharest, Athens and Cyprus lose their calendars (the Markets
    # view): held below 3.1 until exchange_calendars (4.13.2) supports it.
    "pandas>=2.1,<3.1",
    "numpy>=1.26",
    "plotly>=5.18",
    "tzdata>=2023.3",
    "exchange_calendars>=4.5",  # world exchange sessions, lunch breaks and holidays
    "duckdb>=1.1",  # closed months of bars by column (storage/history.py)
    "pymongo>=4.9",  # documents on the MongoDB server here (mongo.py, storage/documents.py)
]

[project.optional-dependencies]
dev = ["pytest>=8", "cryptography>=42"]  # cryptography: the DKIM tests (dkim.py imports it when used)

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
liminal_libs = ["ui/static/*"]  # the icons and the theme every app serves beside its page

[tool.pytest.ini_options]
testpaths = ["tests"]

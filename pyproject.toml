[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "liminal-libs"
version = "1.73.0"  # the library's own release (CHANGELOG.md)
description = "The Liminal library: the stores, the plugin contract, the collector and the scheme every Liminal program builds on (the chart app, the integrator, the plugins)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    # pandas 3.1 refuses exchange_calendars' OrthodoxEaster offset ("does not have a vectorized
    # implementation"), and Belgrade, Bucharest, Athens and Cyprus lose their calendars (the Markets
    # view): held below 3.1 until exchange_calendars (4.13.2) supports it.
    "pandas>=2.1,<3.1",
    "numpy>=1.26",
    "plotly>=5.18",
    "tzdata>=2023.3",
    "exchange_calendars>=4.5",  # world exchange sessions, lunch breaks and holidays
    "duckdb>=1.1",  # closed months of bars by column (storage/history.py)
    "pymongo>=4.9",  # documents on the MongoDB server here (mongo.py, storage/documents.py)
]

[project.optional-dependencies]
# cryptography: the DKIM tests (dkim.py imports it when used); maxminddb: the GeoIP tests (geo.py imports it when used)
dev = ["pytest>=8", "cryptography>=42", "maxminddb>=3.2"]
geo = ["maxminddb>=3.2"]  # geo.py: places for the firewalls' World Wide Web tab, read from a local .mmdb file

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# the icons and the theme every app serves beside its page; vendor/world: the globe's land and borders
# (liminal-globe.js), and vendor/world/coast-h its coast tiles past 24x (a glob takes no folder's files);
# ebpf/scripts: the bpftrace programs the Linux watch runs
liminal_libs = ["ui/static/*", "ui/static/vendor/world/*", "ui/static/vendor/world/coast-h/*", "ebpf/scripts/*.bt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
